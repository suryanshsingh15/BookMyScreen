server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: any unmatched path falls back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend container (service name "backend" from
    # docker-compose.yml — Docker's internal DNS resolves it automatically).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
    }

    # Proxy Socket.io's websocket upgrade requests too
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
